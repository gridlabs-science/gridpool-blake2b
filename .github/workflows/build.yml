name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check tracked secrets and secret logging
        run: node scripts/security-source-check.mjs

      - name: Check Blake2b source locks and fail-closed mainnet pin
        run: node scripts/check-blake2b-source-lock.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: boot_portal/ui/package-lock.json

      - name: Build and test dashboard
        working-directory: boot_portal/ui
        run: |
          npm ci
          npm test
          npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore app
        run: dotnet restore boot_portal/boot_portal.csproj

      - name: Build app
        run: dotnet build boot_portal/boot_portal.csproj --configuration Release --no-restore

      - name: Restore tests
        run: dotnet restore boot.tests/boot.tests.csproj

      - name: Build tests
        run: dotnet build boot.tests/boot.tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test boot.tests/boot.tests.csproj --configuration Release --no-build

  docker:
    runs-on: ubuntu-latest
    needs: dotnet
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and publish Docker image
        id: publish
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ github.event_name != 'pull_request' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GRIDPOOL_RELEASE_VERSION=${{ github.ref_name }}+${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record published digest
        if: github.event_name != 'pull_request'
        run: echo '${{ steps.publish.outputs.digest }}' > image-digest.txt

      - name: Upload digest artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: gridpool-blake2b-image-digest
          path: image-digest.txt

      - name: Make appliance image publicly pullable
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh api --method PATCH
          /orgs/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}
          -f visibility=public
