services:
  boot-portal:
    # Set this to a locally built, immutable image tag or digest. There is
    # deliberately no `latest` fallback for the experimental Blake network.
    image: ${GRIDPOOL_BOOT_IMAGE:?set GRIDPOOL_BOOT_IMAGE to an immutable GridPool image}
    container_name: gridpool-blake2b-testnet4-staging
    restart: "no"
    environment:
      BOOT_PORTAL_CONFIG_PATH: /config/boot_portal_config.json
      BOOT_PORTAL_LOCAL_CONFIG_PATH: /data/boot_portal_config.local.json
      BOOT_PORTAL_STATE_PATH: /data/pool_state.json
    extra_hosts:
      # This address belongs only to the dedicated bridge below. The attached
      # Knots node must allow this /24 for its otherwise loopback-only RPC/ZMQ
      # listeners; it is not a public host address.
      - "host.docker.internal:172.30.0.1"
    ports:
      - "127.0.0.1:${GRIDPOOL_TESTNET4_HTTP_PORT:-5000}:5000"
      # Experimental Testnet4 DATUM protocol ingress. Do not publish the HTTP
      # port, RPC, ZMQ, peer, or UDP ports with this service.
      - "${GRIDPOOL_TESTNET4_DATUM_PORT:-3009}:3009"
    volumes:
      - ./boot_portal_config.testnet4.blake2b.json:/config/boot_portal_config.json:ro
      - ./data:/data
      # The host's bitcoin cookie must be copied into this directory with
      # read-only access for UID 1000 before the container is started.
      - ./bitcoin-cookie:/bitcoin:ro

networks:
  default:
    name: gridpool-blake2b-testnet4-staging
    external: true
