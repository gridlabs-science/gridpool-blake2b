# GridPool Blake2b Testnet4 discovery configuration.
#
# This host is intentionally limited to one chain at a time. RPC and ZMQ stay
# on loopback. Public mining ingress is not enabled by this configuration.

testnet4=1
server=1
daemon=0

listen=1
listenonion=0
upnp=0
natpmp=0
maxconnections=64

prune=12000
dbcache=2048
maxmempool=100
txindex=0
blockfilterindex=0

[testnet4]
addnode=seed.testnet-bitcoin.haf.ovh:48333
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpcport=48332
zmqpubhashblock=tcp://127.0.0.1:28332
zmqpubrawblock=tcp://127.0.0.1:28333

# Consensus-critical activation headline observed in Testnet4 block 150027 and
# independently checked against the pinned RC3 validation and mining paths.
blake2b_headline=PyBLOCK-LOTTO-BLAKE2b-t4-ASIC
