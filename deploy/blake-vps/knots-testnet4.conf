# GridPool Blake2b Testnet4 discovery configuration.
#
# This host is intentionally limited to one chain at a time. RPC and ZMQ stay
# on loopback. Public mining ingress is not enabled by this configuration.

testnet4=1
server=1
daemon=0

listen=1
listenonion=0
upnp=0
natpmp=0
maxconnections=64
addnode=seed.testnet-bitcoin.haf.ovh:48333

prune=12000
dbcache=2048
maxmempool=100
txindex=0
blockfilterindex=0

[testnet4]
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpcport=48332
zmqpubhashblock=tcp://127.0.0.1:28332
zmqpubrawblock=tcp://127.0.0.1:28333

# RC3 requires this option even for a non-mining node. Empty is deliberate for
# the initial discovery sync only: it permits inspection of the activation
# block without guessing the consensus headline. Before public mining is
# enabled, replace this with the operator-reviewed headline, clear/resync the
# disposable Testnet4 chainstate, and verify height 150027 again.
blake2b_headline=
