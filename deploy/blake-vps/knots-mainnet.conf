# Activated Blake2b mainnet profile for the constrained VPS.
# Knots RC4 enforces Blake2b and RDTS from the compiled mainnet schedule.

server=1
daemon=0
listen=1
listenonion=0
upnp=0
natpmp=0
maxconnections=64

prune=12000
dbcache=4096
maxmempool=100
txindex=0
blockfilterindex=0

# Exact locally attested activation checkpoint. This skips historical script
# checks below the checkpoint but never skips headers, PoW, or chain selection.
assumevalid=0000000000000050c1e5f69672f459293be14f46e5a494e7a8c8541396f18eeb

[main]
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
# Dedicated, non-routable Docker bridge used by the private GridPool soak.
rpcbind=172.31.0.1
rpcallowip=172.31.0.0/24
rpcport=8332
zmqpubhashblock=tcp://127.0.0.1:28332
zmqpubrawblock=tcp://127.0.0.1:28333
zmqpubhashblock=tcp://172.31.0.1:28332
zmqpubrawblock=tcp://172.31.0.1:28333

blake2b_headline=8-30 NYPost Deride And Conquer
