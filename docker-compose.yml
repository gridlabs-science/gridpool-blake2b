services:
  boot-portal:
    image: ${GRIDPOOL_BOOT_IMAGE:-ghcr.io/gridlabs-science/boot-protocol:latest}
    container_name: boot-portal
    restart: unless-stopped
    environment:
      BOOT_PORTAL_CONFIG_PATH: /data/boot_portal_config.json
      BOOT_PORTAL_LOCAL_CONFIG_PATH: /data/boot_portal_config.local.json
      BOOT_PORTAL_STATE_PATH: /data/${GRID_BOOT_STATE_FILE:-pool_state.json}
    ports:
      - "5000:5000"
      - "3008:3008"
      - "5001:5001/udp"
    # Container loopback is this container, not the Docker host. For an attached
    # Bitcoin node, either join its external network (below), use host networking,
    # or add host.docker.internal:host-gateway and configure that hostname.
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    # networks:
    #   - bitcoin
    volumes:
      - ./data:/data

